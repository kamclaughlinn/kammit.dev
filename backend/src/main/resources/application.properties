server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=elvis-backend

# Local default: file H2 under ./data (survives restarts).
# On Render/Neon: set DATABASE_URL (postgres://...) — see DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=jdbc:h2:file:./data/kammit;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Set on Render (and locally) so only you can delete phrases.
# Example: elvis.admin-key=super-secret-phrase
elvis.admin-key=${ELVIS_ADMIN_KEY:}
