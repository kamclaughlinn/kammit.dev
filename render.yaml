databases:
  - name: kammit-db
    plan: free

services:
  - type: web
    name: kammit-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/elvis
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kammit-db
          property: connectionString
