name: Keep Render API awake

on:
  schedule:
    # Render free tier sleeps after ~15 min idle — ping every 14 min
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Elvis API
        run: curl -fsS "https://kammit-api.onrender.com/api/elvis" > /dev/null
