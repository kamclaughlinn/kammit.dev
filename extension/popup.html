<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAMmit Record Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="xp-shell">
      <header class="xp-titlebar" id="xp-titlebar">
        <span class="xp-title">record_player.exe</span>
        <div class="xp-controls" aria-hidden="true">
          <span>_</span><span>□</span><span class="xp-close">×</span>
        </div>
      </header>

      <main class="player">
        <p class="eyebrow">kammit.dev · elvis approved vinyl</p>

        <section class="stage" aria-label="Record player">
          <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>

          <div class="elvis-wrap" id="elvis-wrap">
            <img
              class="elvis"
              id="elvis"
              src="assets/elvis-cat.png"
              alt="Elvis the cat"
              draggable="false"
              width="96"
              height="101"
            />
            <span class="elvis-shadow" aria-hidden="true"></span>
          </div>

          <div class="deck">
            <div class="platter" id="platter" data-spinning="false">
              <div class="groove" aria-hidden="true"></div>
              <div class="label">
                <span class="label-kam">KAM</span>
              </div>
            </div>
            <div class="tonearm" id="tonearm" data-down="false" aria-hidden="true">
              <span class="arm"></span>
              <span class="needle"></span>
            </div>
          </div>
        </section>

        <section class="meta" aria-live="polite">
          <h1 id="track-name">No track yet</h1>
          <p id="track-artist">Connect Spotify & paste a playlist or album</p>
          <p id="track-album" class="album">—</p>
          <p id="track-index" class="index">song — / —</p>
        </section>

        <section class="progress-block">
          <div class="times">
            <span id="time-elapsed">0:00</span>
            <span id="time-left">−0:00</span>
            <span id="time-total">0:00</span>
          </div>
          <div
            class="progress-track"
            id="progress-track"
            role="slider"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            tabindex="0"
          >
            <div class="progress-fill" id="progress-fill"></div>
            <button type="button" class="heart-scrubber" id="heart-scrubber" aria-label="Seek">
              <img
                class="pixel-heart-static"
                src="assets/pixel-heart.png"
                alt=""
                draggable="false"
                width="18"
                height="13"
              />
            </button>
          </div>
        </section>

        <section class="controls">
          <button type="button" id="btn-prev" class="xp-btn" title="Previous">⏮</button>
          <button type="button" id="btn-play" class="xp-btn xp-btn-main" title="Play/Pause">▶</button>
          <button type="button" id="btn-next" class="xp-btn" title="Next">⏭</button>
        </section>

        <section class="playlist-form">
          <label for="playlist-url">Playlist or album URL</label>
          <div class="row">
            <input
              id="playlist-url"
              type="url"
              placeholder="https://open.spotify.com/playlist/… or /album/…"
              autocomplete="off"
            />
            <button type="button" id="btn-load" class="xp-btn">Load</button>
          </div>
          <p id="status" class="status" role="status"></p>
        </section>

        <section class="auth-row">
          <button type="button" id="btn-login" class="xp-btn xp-btn-accent">Connect Spotify</button>
          <button type="button" id="btn-logout" class="xp-btn ghost hidden">Log out</button>
        </section>
      </main>
    </div>

    <script src="vendor/spotify-player.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
